- code: STEGR8
  name: Possessive form
  engine: llm
  scope: sentence
  source: https://www.asd-europe.org/standards-specifications/simplified-technical-english/
  prompt: >-
    ASD-STE100 Issue 9, Part 1, GR-8 (page 1-9-13). The possessive apostrophe form is permitted,
    but use it correctly. When its ownership or association is unclear, choose an explicit alternative
    only if it preserves the intended relationship. This is a recommendation, not a mandatory
    rule. The supplied Issue 9 PDF includes Part 2's controlled dictionary, but this catalog does
