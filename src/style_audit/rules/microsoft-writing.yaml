schema_version: 1
rules:
  - code: MWG001
    name: Reader-first message order
    engine: llm
    scope: paragraph
    source: https://learn.microsoft.com/en-us/style-guide/top-10-tips-style-voice
    prompt: >-
      Review whether the paragraph makes its most important reader-relevant point, result,
      or next step clear early. Flag only when needed information is buried beneath setup
      or repeated background. Preserve useful context, narrative sequence, suspense,
      emphasis, and uncertainty; do not force every paragraph to lead with a conclusion or
      invent actions.
    examples:
      - before: >-
          We compared the options with the team's needs, including operating costs and the
          expected migration work. The team recommends the hosted option.
        after: >-
          The team recommends the hosted option after weighing operating costs and expected
          migration work against its needs.
        explanation: >-
          State the recommendation first, then give the factors that support it.

  - code: MWG002
    name: Plain, audience-fit wording
    engine: llm
    scope: paragraph
    source: https://learn.microsoft.com/en-us/style-guide/word-choice/use-simple-words-concise-sentences
    prompt: >-
      Flag jargon, unnecessarily complex wording, or ambiguous common words only when a
      familiar precise word or a brief explanation would better fit the intended audience.
      Preserve necessary technical terms, established terminology, and expert vocabulary
      when they are accurate and clear in context. Do not treat rarity alone as a problem.
    examples:
      - before: The service facilitates the transfer of files.
        after: The service transfers files.
        explanation: >-
          The direct verb names the action without obscuring it in a formal phrase.

  - code: MWG003
    name: Concision with meaning intact
    engine: llm
    scope: paragraph
    source: https://learn.microsoft.com/en-us/style-guide/word-choice/use-simple-words-concise-sentences
    prompt: >-
      Flag repeated ideas, empty modifiers, or phrases that add no substance and delay the
      point. Suggest a shorter expression only when it preserves qualifications, reasoning,
      uncertainty, technical precision, and useful context. Brevity is not a goal by itself;
      preserve intentional emphasis and voice.
    examples:
      - before: At this point in time, we're currently reviewing every individual request separately.
        after: We're reviewing each request separately.
        explanation: >-
          The opening and modifiers repeat information already expressed by currently and
          individually.

  - code: MWG004
    name: Natural, context-appropriate voice
    engine: llm
    scope: paragraph
    source: https://learn.microsoft.com/en-us/style-guide/top-10-tips-style-voice
    prompt: >-
      Flag wording that is needlessly stiff, impersonal, or distant when natural language
      would preserve the meaning and suit the audience. Prefer a warm, human, conversational
      tone when the context allows it. Do not force contractions, slang, jokes, cheerfulness,
      or informality; keep the author's voice and adapt to serious, expert, and formal contexts.
    examples:
      - before: We are pleased to inform you that the review has now been completed.
        after: We've completed the review.
        explanation: >-
          The direct, natural sentence keeps the update without its ceremonial framing.

  - code: MWG005
    name: Clear sentence construction
    engine: llm
    scope: sentence
    source: https://learn.microsoft.com/en-us/style-guide/grammar/grammar-and-parts-of-speech
    prompt: >-
      Flag only syntax that makes the actor, action, relationships, or modifiers hard to
      follow. Consider direct wording or active voice when it makes agency clearer, and
      simplify nested clauses or long modifier chains when they impede understanding.
      Preserve meaningful passive voice, technical precision, and long but clear sentences;
      do not require active voice universally or impose a word or verb count.
    examples:
      - before: The committee's approval of the proposal was granted after review by the staff.
        after: The committee approved the proposal after the staff reviewed it.
        explanation: >-
          The revision names the actors and actions directly without changing their order.

  - code: MWG006
    name: Consistent terms and useful acronyms
    engine: llm
    scope: document
    source: https://learn.microsoft.com/en-us/style-guide/checklists/acronyms-checklist
    prompt: >-
      Check whether the same term is used consistently for the same concept and whether
      unfamiliar acronyms are introduced only when useful, defined on first use, and reused
      consistently. Avoid one-off abbreviations when spelling out the term is clearer.
      Preserve familiar acronyms, established domain vocabulary, proper names, quotations,
      and deliberate distinctions. Do not infer unfamiliarity from word frequency alone.
    examples:
      - before: >-
          The service-level objective guides alerts. The SLO also sets the alert target.
        after: >-
          The service-level objective (SLO) guides alerts. The SLO also sets the alert target.
        explanation: >-
          Define a useful, audience-relevant abbreviation on its first occurrence.

  - code: MWG007
    name: Scannable section organization
    engine: llm
    scope: section
    source: https://learn.microsoft.com/en-us/style-guide/scannable-content/headings
    prompt: >-
      Review whether this section is organized into meaningful, easy-to-scan parts. When
      dense material covers distinct topics, suggest a logical order, concise paragraphs,
      or descriptive hierarchical headings. Avoid redundant headings, empty structure, and
      breaking a short coherent passage into needless fragments. Keep key information easy
      to locate without imposing a fixed paragraph or section length.
    examples:
      - before: >-
          ## Service update

          A stale certificate caused 12 minutes of downtime. The team replaced the certificate.
          It added an expiry alert. The team published a recovery checklist.
        after: >-
          ## Cause

          A stale certificate caused 12 minutes of downtime.

          ## Recovery

          The team replaced the certificate.

          ## Prevention

          The team added an expiry alert and published a recovery checklist.
        explanation: >-
          Separate the cause, recovery, and prevention details so readers can scan for the
          information they need.

  - code: MWG008
    name: Clear, consistent headings
    engine: llm
    scope: document
    source: https://learn.microsoft.com/en-us/style-guide/scannable-content/headings
    prompt: >-
      Check whether headings are specific, concise, and parallel with headings at the same
      level. For this style, use sentence-style capitalization by default and omit a final
      period or colon. Preserve proper nouns, established names, cited titles, and meaningful
      question marks. Do not demand headings for short content or change a title merely to
      impose uniformity.
    examples:
      - before: '## Reviewing Drafts:'
        after: '## Reviewing drafts'
        explanation: >-
          The heading uses sentence-style capitalization and does not end in punctuation.

  - code: MWG009
    name: Purposeful, parallel lists
    engine: llm
    scope: section
    source: https://learn.microsoft.com/en-us/style-guide/scannable-content/lists
    prompt: >-
      Review lists in this section for a clear purpose and lead-in. Use numbering when order
      or priority matters and bullets for unordered related items. Keep comparable items
      grammatically parallel and their capitalization and ending punctuation consistent
      with whether they are fragments or complete sentences. Prefer prose when a list does
      not improve scanning. Do not impose a fixed item-count limit.
    examples:
      - before: >-
          The review includes:

          - Drafting the proposal
          - The budget is checked
          - Confirming the dates
        after: >-
          The review includes:

          - Draft the proposal.
          - Check the budget.
          - Confirm the dates.
        explanation: >-
          The list items are parallel commands with consistent sentence punctuation.

  - code: MWG010
    name: Clear, consistent punctuation
    engine: llm
    scope: paragraph
    source: https://learn.microsoft.com/en-us/style-guide/checklists/punctuation-checklist
    prompt: >-
      Review punctuation for clarity and consistency with this guide's broad conventions:
      use the serial comma, one space after sentence punctuation, and no spaces around em
      dashes; use a colon for a list introduced by a phrase. Use exclamation points and
      rhetorical questions sparingly, and prefer simpler punctuation when a sentence is
      overloaded. Respect quotations, code, literal text, and contexts with a different
      convention; flag a variation only when it causes clear inconsistency or confusion.
    examples:
      - before: We invited editors, designers and translators.
        after: We invited editors, designers, and translators.
        explanation: >-
          The serial comma makes the final list boundary explicit and follows this style's
          convention.

  - code: MWG011
    name: Consistent number style
    engine: llm
    scope: paragraph
    source: https://learn.microsoft.com/en-us/style-guide/checklists/numbers-checklist
    prompt: >-
      In ordinary prose, spell out zero through nine and sentence-initial numbers; use
      numerals for 10 and above. Use a consistent format for numbers in the same category
      when one requires numerals, while separate categories can use their appropriate
      formats. Use numerals for measurements, percentages, dates, times, dimensions, and
      exact values when they improve clarity. Preserve quoted values, code, mathematics,
      and text readers must reproduce; never change a number's value or reformat data.
    examples:
      - before: We reviewed 8 samples before publication.
        after: We reviewed eight samples before publication.
        explanation: >-
          In ordinary prose, spell out a single-digit count when no numeric-format exception
          applies.
      - before: We reviewed eight drafts and 14 responses.
        after: We reviewed eight drafts and 14 responses.
        explanation: >-
          These counts refer to separate categories, so each follows the ordinary format
          for its value rather than forcing the same format across both.

  - code: MWG012
    name: Inclusive, respectful language
    engine: llm
    scope: paragraph
    source: https://learn.microsoft.com/en-us/style-guide/bias-free-communication
    prompt: >-
      Flag clear cases of generic gendered pronouns, stereotyping, unsupported generalizations,
      or demeaning language that excludes or disrespects people. Use respectful language;
      generally use people-first wording for disability, while honoring a person's or
      community's stated identity language and preferences. Mention identity or disability
      only when relevant. Preserve direct quotations, real people's pronouns, and contexts
      where identity is relevant. Do not infer identities or flag a term in isolation.
    examples:
      - before: Each reviewer should upload his notes.
        after: Each reviewer should upload their notes.
        explanation: >-
          Singular they avoids assigning a gender to a reviewer whose identity is unknown.

  - code: MWG013
    name: Accessible references
    engine: llm
    scope: paragraph
    source: https://learn.microsoft.com/en-us/style-guide/accessibility/writing-all-abilities
    prompt: >-
      Check whether links and references make sense to readers without relying on nearby
      visual layout or directional-only cues. Prefer descriptive link wording that identifies
      the destination and name the relevant content instead of using unexplained 'here',
      'above', or 'below'. Keep necessary sequence or location descriptions when they add
      useful context. Judge only visible wording; do not assume the link destination or
      visual design beyond what the text shows.
    examples:
      - before: The migration checklist is here.
        after: Read the migration checklist for next steps.
        explanation: >-
          The revised reference names the resource instead of depending on the reader to
          interpret a contextless link.
