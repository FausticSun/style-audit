schema_version: 1
rules:
- code: NAS001
  name: Banned outright words and phrases
  engine: deterministic
  scope: sentence
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#words-to-cut
  description: >-
    Flags exact matches for terms the source explicitly lists as banned outright.
  detector:
    kind: regex
    pattern: (?<!\w)(?:delve|foster|leverage|utilize|facilitate|empower|streamline|robust|cutting\-edge|paradigm\
      shift|game\ changer|this\ is\ huge|this\ changes\ everything|tapestry|realm|beacon|multifaceted|meticulous|intricate|paramount|transformative|elevate|embark|supercharge|harness|ever\-evolving)(?!\w)
    flags:
    - ignorecase
    target: unit
    message: Avoid the explicitly discouraged term {evidence!r}.
    fix: Replace it with a direct, concrete word that fits the intended meaning.
  examples:
  - before: We utilize the parser.
    after: We use the parser.
    explanation: >-
      The listed verb can be replaced without changing the action.
- code: NAS002
  name: Emoji in headings
  engine: deterministic
  scope: section
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  description: >-
    Flags emoji decorating Markdown headings.
  detector:
    kind: regex
    pattern: '[\U0001F000-\U0001FAFF\u2600-\u27BF]'
    flags: []
    target: heading
    message: Remove decorative emoji from this heading.
    fix: Use a plain heading that reflects the section's content.
  examples:
  - before: '# 🚀 Launch'
    after: '# Launch'
    explanation: >-
      The emoji decorates the heading rather than adding information.
- code: NAS003
  name: Weak verb phrases
  engine: deterministic
  scope: sentence
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#editing-principles
  description: >-
    Flags the source's explicit examples 'serves as', 'made a decision', and 'has the ability
    to'.
  detector:
    kind: regex
    pattern: (?<!\w)(?:serves as|made a decision|has the ability to)(?!\w)
    flags:
    - ignorecase
    target: unit
    message: Replace the inflated verb phrase {evidence!r} with a direct verb.
    fix: Use a concise verb, such as 'is', 'has', or 'decided', when it preserves the meaning.
  examples:
  - before: The service has the ability to audit drafts.
    after: The service can audit drafts.
    explanation: >-
      The direct modal verb preserves the stated capability.
- code: NAS101
  name: Binary contrasts
  engine: llm
  scope: paragraph
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect formulaic 'not X, but Y' contrasts when stating Y directly would be clearer.
  examples:
  - before: The question isn't whether to use retries. It's how many retries to allow.
    after: How many retries should we allow?
    explanation: >-
      The point is the retry count; the contrast adds no separate constraint. Keep contrasts that
      convey a relevant correction.
- code: NAS102
  name: Throat-clearing openers
  engine: llm
  scope: paragraph
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect generic opening phrases that delay the point; preserve personal context that earns
    its place.
  examples:
  - before: 'Here''s the thing: the build passed.'
    after: The build passed.
    explanation: >-
      The opener delays the result without supplying personal context.
- code: NAS103
  name: Faux-insight setups
  engine: llm
  scope: sentence
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect claims that flatter the writer as uniquely insightful without adding substance.
  examples:
  - before: 'Here''s what nobody tells you: backups need restore tests.'
    after: Backups need restore tests.
    explanation: >-
      The exclusivity claim supplies no evidence and is not needed to state the point.
- code: NAS104
  name: Colon reveals
  engine: llm
  scope: sentence
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect lowercase dramatic reveals after a colon; allow lists, labels, quotations, titles,
    code, and grammatical capitalization.
  examples:
  - before: 'The best part: it keeps your drafts.'
    after: It keeps your drafts.
    explanation: >-
      The lowercase reveal supplies a dramatic label, not a grammatical need for the colon. Ordinary
      labels and lists remain valid.
- code: NAS105
  name: Superficial analysis
  engine: llm
  scope: sentence
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect trailing -ing clauses that claim significance without explaining a concrete mechanism
    or consequence.
  examples:
  - before: The release adds file search, highlighting the team's commitment to better workflows.
    after: The release adds file search.
    explanation: >-
      The trailing clause asserts significance without explaining a mechanism; the revision keeps
      the stated feature.
- code: NAS106
  name: Importance puffery
  engine: llm
  scope: sentence
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect inflated claims of importance in place of concrete facts.
  examples:
  - before: The company launched its first paid plan, marking a pivotal moment.
    after: The company launched its first paid plan.
    explanation: >-
      The first paid plan is already a concrete fact. Remove the importance claim rather than
      inventing evidence for it.
- code: NAS107
  name: Interpretive metadiscourse
  engine: llm
  scope: paragraph
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect redundant instructions about what to notice or how to interpret a point.
  examples:
  - before: The queue stopped losing jobs. That last part matters more than it sounds.
    after: The queue stopped losing jobs.
    explanation: >-
      The second sentence tells readers how to react but gives them no additional reason.
- code: NAS108
  name: Weasel attribution
  engine: llm
  scope: paragraph
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect vague appeals to unnamed experts, studies, or reports; do not require attribution for
    ordinary supported statements.
  examples:
  - before: Experts agree that caching reduces latency. In our test, caching cut latency from
      8 ms to 2 ms.
    after: In our test, caching cut latency from 8 ms to 2 ms.
    explanation: >-
      The named test and its measurements are already in the draft; the unnamed experts add no
      verifiable support.
- code: NAS109
  name: Fake-strong verbs
  engine: llm
  scope: sentence
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect inflated verb phrases where a direct verb or plain 'is'/'has' is clearer.
  examples:
  - before: The service serves as a tracker for invoices.
    after: The service tracks invoices.
    explanation: >-
      The direct verb states the same function without the inflated construction.
- code: NAS110
  name: Synonym cycling
  engine: llm
  scope: section
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect repeated renaming of the same subject solely to avoid repeating a clear term.
  examples:
  - before: The agent reviews the draft. The assistant scores the piece. The tool suggests fixes.
    after: The agent reviews the draft, scores it, and suggests fixes.
    explanation: >-
      Here all three subject labels refer to the same agent, and both object labels refer to the
      same draft. Keep the identities consistent.
- code: NAS111
  name: Negative listing
  engine: llm
  scope: paragraph
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect stacked 'not X, not Y, but Z' fragments that can state Z directly.
  examples:
  - before: Not a dashboard. Not a spreadsheet. A queue.
    after: A queue.
    explanation: >-
      For a component label, the negative list adds drama rather than a relevant distinction.
      Keep exclusions that readers actually need.
- code: NAS112
  name: Dramatic fragmentation
  engine: llm
  scope: paragraph
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect stacked dramatic fragments or empty repeated endings; preserve intentional voice and
    useful cadence.
  examples:
  - before: The migration finished. Quietly. Completely. No loose ends.
    after: The migration finished quietly and completely.
    explanation: >-
      Combine the stacked emphasis while preserving the manner and completion claim. A deliberate
      single fragment is not automatically wrong.
- code: NAS113
  name: Robotic rhythm
  engine: llm
  scope: document
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect conspicuously repeated sentence or paragraph shapes and uniform punchy cadence.
  examples:
  - before: 'We opened the file.


      We read the code.


      We found the bug.


      We fixed the bug.


      We ran the suite.


      We shipped the patch.'
    after: 'After opening the file and reading the code, we found and fixed the bug.


      We ran the suite and shipped the patch.'
    explanation: >-
      In narrative prose, six identically shaped micro-paragraphs obscure the sequence. Group
      related actions without claiming that the suite passed; a parallel checklist could be appropriate
      instead.
- code: NAS114
  name: Rhetorical setups
  engine: llm
  scope: paragraph
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect empty rhetorical teasers or self-answered question-and-answer pairs.
  examples:
  - before: 'What if I told you the test caught a race? Plot twist: it did.'
    after: The test caught a race.
    explanation: >-
      The self-answered teaser withholds a result that can be stated directly.
- code: NAS115
  name: Fake-profound kickers
  engine: llm
  scope: document
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect a final aphorism or cute metaphor that restates or dilutes the preceding concrete point.
  examples:
  - before: The queue processed all 12 jobs. In the end, every storm is just a doorway.
    after: The queue processed all 12 jobs.
    explanation: >-
      The final metaphor supplies no clear takeaway about the observed result.
- code: NAS116
  name: Summary-recap endings
  engine: llm
  scope: document
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect a conclusion that merely repeats the preceding text instead of adding a takeaway or
    next action.
  examples:
  - before: 'The parser now handles empty files. It also preserves line numbers.


      In conclusion, the parser handles empty files and preserves line numbers.'
    after: The parser now handles empty files and preserves line numbers.
    explanation: >-
      The ending repeats both facts without adding a takeaway or next action.
- code: NAS117
  name: Formatting slop
  engine: llm
  scope: section
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect decorative formatting that impairs the content: mid-sentence bold emphasis, bullets
    better expressed as prose, and headers for tiny sections. Ignore code and examples.
  examples:
  - before: '## Result


      - The test **passed**.

      - The build **passed**.'
    after: The test and build passed.
    explanation: >-
      For this two-item status note, a heading, bullets, and bold emphasis add structure the content
      does not need. Longer status lists may warrant that structure.
- code: NAS118
  name: Em dash overuse
  engine: llm
  scope: document
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#patterns-to-cut
  prompt: >-
    Detect decorative or clustered em dashes used as a rhythm crutch; short copy should normally
    avoid them and long copy should use at most a few when useful.
  examples:
  - before: The test passed — finally — and the build completed — without errors.
    after: The test finally passed, and the build completed without errors.
    explanation: >-
      Three decorative dashes crowd a short sentence; the revision retains both results and the
      emphasis on finally.
- code: NAS119
  name: Abstraction and concreteness
  engine: llm
  scope: section
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#editing-principles
  prompt: >-
    Flag generic, portable claims or inflated abstractions when the draft provides no concrete
    fact, mechanism, consequence, name, number, date, or example to support them. Do not invent
    missing facts.
  examples:
  - before: The update transforms the experience. We do not yet have measurements of its effect
      on review time.
    after: We do not yet have measurements of the update's effect on review time.
    explanation: >-
      The draft supplies no support for the benefit claim and acknowledges uncertainty. Keep that
      uncertainty rather than inventing measurements.
- code: NAS120
  name: Voice-preserving clarity
  engine: llm
  scope: sentence
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#editing-principles
  prompt: >-
    Flag only genuinely tangled sentences, needless passive constructions with no human actor,
    or empty qualifiers. Preserve useful uncertainty, spoken rhythm, humor, edge, deliberate fragments,
    and personal context.
  examples:
  - before: The report, which the team had revised after the incident that occurred during the
      release, was shared by the team.
    after: The team revised the report after the release incident and then shared it.
    explanation: >-
      The team and the event order already appear in the original. Unnest the clauses and make
      the team explicit without deleting useful uncertainty or voice.
- code: NAS121
  name: Filler phrases
  engine: llm
  scope: sentence
  source: https://github.com/petergyang/no-ai-slop/blob/000650b156983f5159695b441477f4e63b25dc85/skills/no-ai-slop/SKILL.md#words-to-cut
  prompt: >-
    Flag a listed filler phrase only when it delays the point in this specific sentence; retain
    useful spoken rhythm or emphasis.
  examples:
  - before: It's worth noting that the service uses port 8003.
    after: The service uses port 8003.
    explanation: >-
      Here the filler adds neither emphasis nor context; removing it leaves the fact intact.
