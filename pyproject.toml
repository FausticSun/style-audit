[project]
name = "style-audit"
version = "0.1.0"
description = "A Python writing-style auditor combining deterministic NLP and LLM judgments."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["litellm>=1.106.4"]

[project.scripts]
style-audit = "style_audit:main"

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "pymdown-extensions>=10,<13",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
